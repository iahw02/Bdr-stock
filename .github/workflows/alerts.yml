name: alerts
on:
  schedule:
    - cron: "0 8 * * 1-5"
    - cron: "45 13 * * 1-5"
    - cron: "30 19 * * 1-5"
  workflow_dispatch:
    inputs:
      test:
        description: "رسالة تجربة فقط"
        type: boolean
        default: false
concurrency:
  group: alerts
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python alerts.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_MODE: ${{ inputs.test }}
