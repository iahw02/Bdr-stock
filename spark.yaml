name: spark
on:
  workflow_dispatch:
    inputs:
      probe:
        description: "فحص جودة البيانات فقط (بدون تنبيهات)"
        type: boolean
        default: false
concurrency:
  group: spark
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python spark.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          TV_COOKIE: ${{ secrets.TV_COOKIE }}
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
          PROBE: ${{ inputs.probe }}
